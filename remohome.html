<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>REMO AI</title>

    <script src="https://accounts.google.com/gsi/client" async defer></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background:
                radial-gradient(circle at top right, #263b70 0%, transparent 35%),
                radial-gradient(circle at bottom left, #173d4a 0%, transparent 35%),
                #080b14;
            color: white;
            min-height: 100vh;
        }

        button,
        input,
        textarea {
            font: inherit;
        }

        .hidden {
            display: none !important;
        }

        .login-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-box {
            width: 100%;
            max-width: 430px;
            padding: 35px;
            border: 1px solid rgba(255,255,255,.12);
            background: rgba(255,255,255,.06);
            backdrop-filter: blur(20px);
            border-radius: 24px;
            box-shadow: 0 30px 80px rgba(0,0,0,.35);
            text-align: center;
        }

        .logo {
            width: 75px;
            height: 75px;
            border-radius: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            font-size: 28px;
            font-weight: bold;
            background: linear-gradient(135deg, #6d5dfc, #00c6ff);
        }

        h1 {
            margin: 0 0 10px;
        }

        .muted {
            color: #9ba4b5;
        }

        #googleButton {
            margin-top: 25px;
            display: flex;
            justify-content: center;
        }

        .app {
            min-height: 100vh;
        }

        .topbar {
            position: sticky;
            top: 0;
            z-index: 20;
            padding: 14px 20px;
            border-bottom: 1px solid rgba(255,255,255,.08);
            background: rgba(8,11,20,.82);
            backdrop-filter: blur(20px);
        }

        .topbar-inner {
            max-width: 1200px;
            margin: auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .avatar {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            object-fit: cover;
        }

        .user-name {
            font-weight: bold;
        }

        .role {
            font-size: 12px;
            color: #9ba4b5;
        }

        .quota {
            padding: 8px 14px;
            border-radius: 12px;
            background: rgba(0,198,255,.10);
            border: 1px solid rgba(0,198,255,.2);
        }

        .quota strong {
            color: #00c6ff;
        }

        .logout {
            border: 0;
            background: rgba(255,255,255,.08);
            color: white;
            padding: 9px 15px;
            border-radius: 10px;
            cursor: pointer;
        }

        .logout:disabled {
            opacity: .35;
            cursor: not-allowed;
        }

        .container {
            max-width: 1200px;
            margin: auto;
            padding: 30px 20px;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 330px;
            gap: 20px;
        }

        .card {
            background: rgba(255,255,255,.055);
            border: 1px solid rgba(255,255,255,.1);
            border-radius: 20px;
            padding: 22px;
            backdrop-filter: blur(15px);
        }

        .chat {
            min-height: 500px;
            display: flex;
            flex-direction: column;
        }

        .messages {
            flex: 1;
            min-height: 350px;
            max-height: 500px;
            overflow-y: auto;
            padding: 10px;
        }

        .message {
            max-width: 80%;
            padding: 12px 15px;
            border-radius: 16px;
            margin-bottom: 12px;
            line-height: 1.6;
        }

        .message.me {
            margin-right: auto;
            background: linear-gradient(135deg, #5b4df6, #3478f6);
        }

        .message.other {
            margin-left: auto;
            background: rgba(255,255,255,.09);
        }

        .message-meta {
            font-size: 11px;
            opacity: .6;
            margin-top: 5px;
        }

        .composer {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        .composer textarea {
            flex: 1;
            resize: none;
            min-height: 55px;
            border: 1px solid rgba(255,255,255,.1);
            background: rgba(0,0,0,.2);
            color: white;
            border-radius: 14px;
            padding: 15px;
            outline: none;
        }

        .send {
            border: 0;
            border-radius: 14px;
            padding: 0 22px;
            background: linear-gradient(135deg,#6d5dfc,#00aaff);
            color: white;
            cursor: pointer;
        }

        .send:disabled {
            opacity: .35;
            cursor: not-allowed;
        }

        .admin-panel h3 {
            margin-top: 0;
        }

        .admin-user {
            padding: 13px;
            border-radius: 13px;
            background: rgba(255,255,255,.05);
            margin-bottom: 10px;
        }

        .admin-user small {
            color: #9ba4b5;
        }

        .admin-actions {
            display: flex;
            gap: 7px;
            margin-top: 10px;
        }

        .admin-actions input {
            width: 80px;
            background: rgba(0,0,0,.25);
            color: white;
            border: 1px solid rgba(255,255,255,.12);
            border-radius: 8px;
            padding: 7px;
        }

        .admin-actions button {
            border: 0;
            border-radius: 8px;
            padding: 7px 10px;
            cursor: pointer;
            color: white;
            background: #3457d5;
        }

        .notification {
            position: fixed;
            bottom: 20px;
            left: 20px;
            padding: 14px 18px;
            border-radius: 12px;
            background: #1d2435;
            border: 1px solid rgba(255,255,255,.12);
            box-shadow: 0 15px 40px rgba(0,0,0,.3);
            z-index: 100;
        }

        .error {
            color: #ff7272;
            margin-top: 15px;
        }

        @media (max-width: 800px) {
            .grid {
                grid-template-columns: 1fr;
            }

            .topbar-inner {
                flex-wrap: wrap;
            }

            .quota {
                order: 3;
                width: 100%;
                text-align: center;
            }
        }
    </style>
</head>

<body>

<section id="loginPage" class="login-page">

    <div class="login-box">

        <div class="logo">R</div>

        <h1>REMO AI</h1>

        <p class="muted">
            سجل الدخول باستخدام حساب Google
        </p>

        <div id="googleButton"></div>

        <div id="loginError" class="error"></div>

    </div>

</section>


<div id="app" class="app hidden">

    <header class="topbar">

        <div class="topbar-inner">

            <div class="user-info">

                <img id="avatar"
                     class="avatar"
                     src=""
                     alt="avatar">

                <div>
                    <div id="userName" class="user-name"></div>
                    <div id="userRole" class="role"></div>
                </div>

            </div>

            <div class="quota">
                المتبقي:
                <strong id="quota">700</strong>
            </div>

            <button
                id="logoutButton"
                class="logout"
                onclick="logout()">
                خروج
            </button>

        </div>

    </header>


    <main class="container">

        <div class="grid">

            <section class="card chat">

                <h2>محادثة REMO</h2>

                <div
                    id="messages"
                    class="messages">
                </div>

                <div class="composer">

                    <textarea
                        id="messageInput"
                        placeholder="اكتب رسالتك..."
                    ></textarea>

                    <button
                        id="sendButton"
                        class="send"
                        onclick="sendMessage()">
                        إرسال
                    </button>

                </div>

            </section>


            <aside
                id="adminPanel"
                class="card admin-panel hidden">

                <h3>لوحة الأدمن</h3>

                <p class="muted">
                    المستخدمون
                </p>

                <div id="usersList"></div>

            </aside>

        </div>

    </main>

</div>


<div
    id="notification"
    class="notification hidden">
</div>


<script>

/* =========================================================
   CONFIG
========================================================= */

/*
 * Google Client ID
 */
const GOOGLE_CLIENT_ID =
    "610561621500-4fk159dv20phoqb3qj90uc0kqsb9tb1i.apps.googleusercontent.com";


/*
 * PHP Backend
 */
const API_URL =
    "https://ballet-traveller-christmas-monitors.trycloudflare.com/api.php";


/*
 * Admin
 */
const ADMIN_EMAIL =
    "adamitm960@gmail.com";


/*
 * Guest quota
 */
const DEFAULT_QUOTA = 700;


/* =========================================================
   STATE
========================================================= */

let currentUser = null;
let messagesTimer = null;


/* =========================================================
   GOOGLE LOGIN
========================================================= */

window.addEventListener("load", function () {

    if (
        typeof google === "undefined" ||
        !google.accounts ||
        !google.accounts.id
    ) {
        showLoginError(
            "Google Login لم يتم تحميله. تأكد من الإنترنت."
        );

        return;
    }


    google.accounts.id.initialize({

        client_id:
            GOOGLE_CLIENT_ID,

        callback:
            handleGoogleLogin,

        auto_select:
            false,

        cancel_on_tap_outside:
            true

    });


    google.accounts.id.renderButton(

        document.getElementById(
            "googleButton"
        ),

        {
            theme:
                "filled_black",

            size:
                "large",

            shape:
                "pill",

            width:
                300
        }

    );

});


/* =========================================================
   GOOGLE CALLBACK
========================================================= */

async function handleGoogleLogin(response) {

    try {

        showLoginError("");


        if (
            !response ||
            !response.credential
        ) {

            throw new Error(
                "Google لم يرجع بيانات تسجيل الدخول."
            );

        }


        const result =
            await apiRequest(
                "login",
                {
                    credential:
                        response.credential
                }
            );


        if (!result.success) {

            throw new Error(
                result.message ||
                "فشل تسجيل الدخول"
            );

        }


        currentUser =
            result.user;


        showApp();


        await loadMessages();


        if (
            currentUser.role ===
            "admin"
        ) {

            await loadUsers();

        }


        startPolling();


    } catch (error) {

        console.error(error);


        showLoginError(
            error.message ||
            "حدث خطأ أثناء تسجيل الدخول"
        );

    }

}


/* =========================================================
   API
========================================================= */

async function apiRequest(
    action,
    data = {}
) {

    const response =
        await fetch(
            API_URL,
            {
                method:
                    "POST",

                headers: {
                    "Content-Type":
                        "application/json"
                },

                body:
                    JSON.stringify({
                        action:
                            action,

                        ...data
                    })
            }
        );


    if (!response.ok) {

        throw new Error(
            "Backend HTTP Error: " +
            response.status
        );

    }


    return await response.json();

}


/* =========================================================
   SHOW APP
========================================================= */

function showApp() {

    document
        .getElementById("loginPage")
        .classList.add("hidden");


    document
        .getElementById("app")
        .classList.remove("hidden");


    document
        .getElementById("userName")
        .textContent =
            currentUser.name;


    document
        .getElementById("userRole")
        .textContent =
            currentUser.role === "admin"
                ? "Administrator"
                : "Guest";


    const avatar =
        document.getElementById(
            "avatar"
        );


    if (currentUser.picture) {

        avatar.src =
            currentUser.picture;

    }


    if (
        currentUser.role ===
        "admin"
    ) {

        document
            .getElementById("adminPanel")
            .classList.remove("hidden");


        document
            .getElementById("quota")
            .textContent =
                "∞";

    } else {

        updateQuota(
            currentUser.quota
        );

    }


    updateButtons();

}


/* =========================================================
   QUOTA
========================================================= */

function updateQuota(quota) {

    currentUser.quota =
        Number(quota);


    document
        .getElementById("quota")
        .textContent =
            currentUser.quota;


    updateButtons();

}


/* =========================================================
   BUTTONS
========================================================= */

function updateButtons() {

    const sendButton =
        document.getElementById(
            "sendButton"
        );


    const input =
        document.getElementById(
            "messageInput"
        );


    const logoutButton =
        document.getElementById(
            "logoutButton"
        );


    if (
        currentUser.role ===
        "admin"
    ) {

        sendButton.disabled =
            false;

        input.disabled =
            false;

        logoutButton.disabled =
            false;

        input.placeholder =
            "اكتب رسالتك...";

        return;

    }


    if (
        Number(currentUser.quota) <= 0
    ) {

        sendButton.disabled =
            true;

        input.disabled =
            true;

        logoutButton.disabled =
            true;

        input.placeholder =
            "انتهى رصيد الرسائل";

    } else {

        sendButton.disabled =
            false;

        input.disabled =
            false;

        logoutButton.disabled =
            false;

        input.placeholder =
            "اكتب رسالتك...";

    }

}


/* =========================================================
   SEND MESSAGE
========================================================= */

async function sendMessage() {

    if (!currentUser) {
        return;
    }


    const input =
        document.getElementById(
            "messageInput"
        );


    const text =
        input.value.trim();


    if (!text) {
        return;
    }


    if (
        currentUser.role !== "admin" &&
        Number(currentUser.quota) <= 0
    ) {

        showNotification(
            "انتهى رصيد الرسائل"
        );

        return;

    }


    try {

        const result =
            await apiRequest(
                "send_message",
                {
                    email:
                        currentUser.email,

                    message:
                        text
                }
            );


        if (!result.success) {

            throw new Error(
                result.message ||
                "فشل إرسال الرسالة"
            );

        }


        input.value = "";


        if (
            currentUser.role !==
            "admin"
        ) {

            updateQuota(
                result.remaining
            );

        }


        await loadMessages();


    } catch (error) {

        showNotification(
            error.message
        );

    }


    updateButtons();

}


/* =========================================================
   LOAD MESSAGES
========================================================= */

async function loadMessages() {

    if (!currentUser) {
        return;
    }


    try {

        const result =
            await apiRequest(
                "get_messages",
                {
                    email:
                        currentUser.email
                }
            );


        if (!result.success) {
            return;
        }


        renderMessages(
            result.messages || []
        );


    } catch (error) {

        console.error(error);

    }

}


/* =========================================================
   RENDER MESSAGES
========================================================= */

function renderMessages(messages) {

    const container =
        document.getElementById(
            "messages"
        );


    container.innerHTML = "";


    messages.forEach(
        message => {

            const div =
                document.createElement(
                    "div"
                );


            const isMe =
                message.sender_email ===
                currentUser.email;


            div.className =
                "message " +
                (
                    isMe
                        ? "me"
                        : "other"
                );


            const text =
                document.createElement(
                    "div"
                );


            text.textContent =
                message.message;


            const meta =
                document.createElement(
                    "div"
                );


            meta.className =
                "message-meta";


            meta.textContent =
                (
                    message.sender_name ||
                    ""
                ) +
                " • " +
                (
                    message.created_at ||
                    ""
                );


            div.appendChild(text);

            div.appendChild(meta);

            container.appendChild(div);

        }
    );


    container.scrollTop =
        container.scrollHeight;

}


/* =========================================================
   ADMIN USERS
========================================================= */

async function loadUsers() {

    if (
        !currentUser ||
        currentUser.role !==
        "admin"
    ) {
        return;
    }


    try {

        const result =
            await apiRequest(
                "get_users",
                {
                    email:
                        currentUser.email
                }
            );


        if (!result.success) {
            return;
        }


        const list =
            document.getElementById(
                "usersList"
            );


        list.innerHTML = "";


        result.users.forEach(
            user => {

                if (
                    user.email.toLowerCase() ===
                    ADMIN_EMAIL.toLowerCase()
                ) {
                    return;
                }


                const div =
                    document.createElement(
                        "div"
                    );


                div.className =
                    "admin-user";


                div.innerHTML = `
                    <strong>
                        ${escapeHtml(user.name)}
                    </strong>

                    <br>

                    <small>
                        ${escapeHtml(user.email)}
                    </small>

                    <br>

                    <small>
                        المتبقي:
                        <b>
                            ${Number(user.quota || 0)}
                        </b>
                    </small>

                    <div class="admin-actions">

                        <input
                            type="number"
                            min="1"
                            value="100"
                            id="quota_${escapeAttr(user.email)}"
                        >

                        <button
                            onclick="addQuota('${escapeJs(user.email)}')">
                            + إضافة
                        </button>

                    </div>
                `;


                list.appendChild(div);

            }
        );


    } catch (error) {

        console.error(error);

    }

}


/* =========================================================
   ADD QUOTA
========================================================= */

async function addQuota(email) {

    const input =
        document.getElementById(
            "quota_" +
            escapeAttr(email)
        );


    const amount =
        Number(input.value);


    if (
        !amount ||
        amount <= 0
    ) {

        showNotification(
            "اكتب كمية صحيحة"
        );

        return;

    }


    try {

        const result =
            await apiRequest(
                "add_quota",
                {
                    admin_email:
                        currentUser.email,

                    user_email:
                        email,

                    amount:
                        amount
                }
            );


        if (!result.success) {

            throw new Error(
                result.message
            );

        }


        showNotification(
            "تمت إضافة " +
            amount +
            " رسالة"
        );


        await loadUsers();


    } catch (error) {

        showNotification(
            error.message
        );

    }

}


/* =========================================================
   LOGOUT
========================================================= */

function logout() {

    if (!currentUser) {
        return;
    }


    if (
        currentUser.role !==
        "admin" &&
        Number(currentUser.quota) <= 0
    ) {

        showNotification(
            "لا يمكنك تسجيل الخروج بعد انتهاء الكوست"
        );

        return;

    }


    if (
        typeof google !==
            "undefined" &&
        google.accounts &&
        google.accounts.id
    ) {

        google.accounts.id.disableAutoSelect();

    }


    currentUser = null;


    if (messagesTimer) {

        clearInterval(
            messagesTimer
        );

        messagesTimer = null;

    }


    document
        .getElementById("app")
        .classList.add("hidden");


    document
        .getElementById("loginPage")
        .classList.remove("hidden");


    document
        .getElementById("messages")
        .innerHTML = "";


    document
        .getElementById("usersList")
        .innerHTML = "";

}


/* =========================================================
   POLLING / NOTIFICATIONS
========================================================= */

function startPolling() {

    if (messagesTimer) {

        clearInterval(
            messagesTimer
        );

    }


    messagesTimer =
        setInterval(
            async () => {

                await loadMessages();


                if (
                    currentUser &&
                    currentUser.role ===
                    "admin"
                ) {

                    await loadUsers();

                }

            },
            5000
        );

}


/* =========================================================
   UI
========================================================= */

function showNotification(text) {

    const box =
        document.getElementById(
            "notification"
        );


    box.textContent =
        text;


    box.classList.remove(
        "hidden"
    );


    setTimeout(
        () => {

            box.classList.add(
                "hidden"
            );

        },
        3000
    );

}


function showLoginError(text) {

    document
        .getElementById("loginError")
        .textContent =
            text;

}


/* =========================================================
   SECURITY HELPERS
========================================================= */

function escapeHtml(value) {

    const div =
        document.createElement(
            "div"
        );

    div.textContent =
        String(value);

    return div.innerHTML;

}


function escapeAttr(value) {

    return String(value)
        .replace(
            /[^a-zA-Z0-9_-]/g,
            "_"
        );

}


function escapeJs(value) {

    return String(value)
        .replaceAll(
            "\\",
            "\\\\"
        )
        .replaceAll(
            "'",
            "\\'"
        );

}

</script>

</body>
</html>

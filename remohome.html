<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>REMO AI</title>

    <!-- Google -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, Tahoma, sans-serif;
            background:
                radial-gradient(circle at top right, #273b78, transparent 35%),
                radial-gradient(circle at bottom left, #164653, transparent 35%),
                #080b14;
            color: #fff;
        }

        button,
        input,
        textarea {
            font: inherit;
        }

        .hidden {
            display: none !important;
        }

        /* LOGIN */

        #loginPage {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-box {
            width: 100%;
            max-width: 430px;
            padding: 40px 30px;
            text-align: center;

            background: rgba(255,255,255,.06);
            border: 1px solid rgba(255,255,255,.12);
            border-radius: 25px;

            backdrop-filter: blur(20px);
            box-shadow: 0 30px 80px rgba(0,0,0,.4);
        }

        .logo {
            width: 75px;
            height: 75px;
            margin: 0 auto 20px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 22px;

            font-size: 30px;
            font-weight: bold;

            background: linear-gradient(
                135deg,
                #6d5dfc,
                #00c6ff
            );
        }

        .login-box h1 {
            margin-bottom: 10px;
        }

        .login-description {
            color: #a7afc1;
            margin-bottom: 25px;
        }

        #googleButton {
            min-height: 50px;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        #loginError {
            margin-top: 15px;
            min-height: 25px;
            color: #ff7373;
            font-size: 14px;
        }

        /* APP */

        #app {
            min-height: 100vh;
        }

        .topbar {
            position: sticky;
            top: 0;
            z-index: 100;

            background: rgba(8,11,20,.88);
            border-bottom: 1px solid rgba(255,255,255,.08);

            backdrop-filter: blur(20px);
        }

        .topbar-inner {
            max-width: 1200px;
            margin: auto;
            padding: 13px 20px;

            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .avatar {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            object-fit: cover;
            background: #222a3b;
        }

        .user-name {
            font-weight: bold;
        }

        .user-role {
            color: #9ca5b8;
            font-size: 12px;
            margin-top: 4px;
        }

        .quota {
            padding: 9px 16px;
            border-radius: 12px;

            background: rgba(0,198,255,.1);
            border: 1px solid rgba(0,198,255,.2);
        }

        .quota strong {
            color: #00c6ff;
            font-size: 18px;
        }

        .logout {
            border: 0;
            padding: 10px 17px;

            border-radius: 10px;

            color: #fff;
            background: rgba(255,255,255,.08);

            cursor: pointer;
        }

        .logout:hover {
            background: rgba(255,255,255,.15);
        }

        .logout:disabled {
            opacity: .35;
            cursor: not-allowed;
        }

        /* MAIN */

        .container {
            max-width: 1200px;
            margin: auto;
            padding: 30px 20px;
        }

        .grid {
            display: grid;
            grid-template-columns: minmax(0,1fr) 330px;
            gap: 20px;
        }

        .card {
            background: rgba(255,255,255,.055);
            border: 1px solid rgba(255,255,255,.1);
            border-radius: 20px;
            backdrop-filter: blur(15px);
        }

        /* CHAT */

        .chat {
            min-height: 650px;
            padding: 22px;

            display: flex;
            flex-direction: column;
        }

        .chat h2 {
            margin-top: 0;
        }

        #messages {
            flex: 1;
            min-height: 450px;
            max-height: 520px;

            overflow-y: auto;

            padding: 10px 5px;
        }

        .message {
            max-width: 80%;
            padding: 12px 15px;
            margin-bottom: 12px;

            border-radius: 16px;

            line-height: 1.7;
            word-break: break-word;
        }

        .message.me {
            margin-right: auto;

            background:
                linear-gradient(
                    135deg,
                    #5b4df6,
                    #3478f6
                );
        }

        .message.other {
            margin-left: auto;
            background: rgba(255,255,255,.09);
        }

        .message.ai {
            margin-left: auto;

            background:
                linear-gradient(
                    135deg,
                    #116466,
                    #087f8c
                );
        }

        .message-meta {
            margin-top: 5px;
            font-size: 11px;
            opacity: .6;
        }

        /* COMPOSER */

        .composer {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        #messageInput {
            flex: 1;

            min-height: 58px;

            resize: none;

            padding: 15px;

            outline: none;

            border: 1px solid rgba(255,255,255,.1);
            border-radius: 14px;

            background: rgba(0,0,0,.2);

            color: white;
        }

        #messageInput:focus {
            border-color: rgba(0,198,255,.5);
        }

        #sendButton {
            min-width: 100px;

            border: 0;
            border-radius: 14px;

            color: white;

            background:
                linear-gradient(
                    135deg,
                    #6d5dfc,
                    #00aaff
                );

            cursor: pointer;
        }

        #sendButton:disabled {
            opacity: .35;
            cursor: not-allowed;
        }

        /* ADMIN */

        .admin-panel {
            padding: 22px;
        }

        .admin-panel h3 {
            margin-top: 0;
        }

        .muted {
            color: #9ca5b8;
        }

        .admin-user {
            padding: 13px;
            margin-bottom: 10px;

            border-radius: 13px;

            background: rgba(255,255,255,.05);
        }

        .admin-user small {
            color: #9ca5b8;
        }

        .admin-actions {
            display: flex;
            gap: 7px;
            margin-top: 10px;
        }

        .admin-actions input {
            width: 80px;

            padding: 7px;

            border: 1px solid rgba(255,255,255,.12);
            border-radius: 8px;

            background: rgba(0,0,0,.25);
            color: white;
            outline: none;
        }

        .admin-actions button {
            border: 0;

            padding: 7px 10px;

            border-radius: 8px;

            color: white;
            background: #3457d5;

            cursor: pointer;
        }

        /* NOTIFICATION */

        #notification {
            position: fixed;

            left: 20px;
            bottom: 20px;

            z-index: 9999;

            padding: 14px 18px;

            border-radius: 12px;

            background: #1d2435;

            border: 1px solid rgba(255,255,255,.12);

            box-shadow: 0 15px 40px rgba(0,0,0,.4);
        }

        /* MOBILE */

        @media(max-width:800px) {

            .grid {
                grid-template-columns: 1fr;
            }

            .topbar-inner {
                flex-wrap: wrap;
            }

            .quota {
                width: 100%;
                order: 3;
                text-align: center;
            }

            .chat {
                min-height: 550px;
            }

            #messages {
                min-height: 350px;
            }
        }
    </style>
</head>

<body>

<!-- =========================
     LOGIN
========================= -->

<section id="loginPage">

    <div class="login-box">

        <div class="logo">
            R
        </div>

        <h1>
            REMO AI
        </h1>

        <div class="login-description">
            سجل الدخول باستخدام حساب Google
        </div>

        <!-- Google Button -->
        <div id="googleButton"></div>

        <div id="loginError"></div>

    </div>

</section>


<!-- =========================
     APPLICATION
========================= -->

<div id="app" class="hidden">

    <header class="topbar">

        <div class="topbar-inner">

            <div class="user-info">

                <img
                    id="avatar"
                    class="avatar"
                    alt="avatar"
                >

                <div>

                    <div
                        id="userName"
                        class="user-name">
                    </div>

                    <div
                        id="userRole"
                        class="user-role">
                    </div>

                </div>

            </div>


            <div class="quota">

                المتبقي:

                <strong id="quota">
                    700
                </strong>

                رسالة

            </div>


            <button
                id="logoutButton"
                class="logout"
                onclick="logout()"
            >
                خروج
            </button>

        </div>

    </header>


    <main class="container">

        <div class="grid">

            <!-- CHAT -->

            <section class="card chat">

                <h2>
                    REMO AI
                </h2>

                <div id="messages"></div>


                <div class="composer">

                    <textarea
                        id="messageInput"
                        placeholder="اكتب رسالتك..."
                    ></textarea>

                    <button
                        id="sendButton"
                        onclick="sendMessage()"
                    >
                        إرسال
                    </button>

                </div>

            </section>


            <!-- ADMIN -->

            <aside
                id="adminPanel"
                class="card admin-panel hidden"
            >

                <h3>
                    لوحة الأدمن
                </h3>

                <p class="muted">
                    المستخدمون
                </p>

                <div id="usersList"></div>

            </aside>

        </div>

    </main>

</div>


<div
    id="notification"
    class="hidden">
</div>


<script>

/* =====================================================
   CONFIG
===================================================== */

const GOOGLE_CLIENT_ID =
    "610561621500-4fk159dv20phoqb3qj90uc0kqsb9tb1i.apps.googleusercontent.com";


/*
 * PHP BACKEND
 */
const API_URL =
    "https://ballet-traveller-christmas-monitors.trycloudflare.com/api.php";


const ADMIN_EMAIL =
    "adamitm960@gmail.com";


let currentUser = null;
let pollTimer = null;


/* =====================================================
   START
===================================================== */

window.addEventListener("load", () => {

    waitForGoogle();

});


function waitForGoogle() {

    if (
        window.google &&
        google.accounts &&
        google.accounts.id
    ) {

        initGoogle();

        return;

    }

    setTimeout(
        waitForGoogle,
        300
    );
}


/* =====================================================
   GOOGLE LOGIN
===================================================== */

function initGoogle() {

    google.accounts.id.initialize({

        client_id:
            610561621500-4fk159dv20phoqb3qj90uc0kqsb9tb1i.apps.googleusercontent.com,

        callback:
            googleLogin,

        auto_select:
            false,

        cancel_on_tap_outside:
            true

    });


    google.accounts.id.renderButton(

        document.getElementById(
            "googleButton"
        ),

        {
            theme: "filled_black",
            size: "large",
            text: "signin_with",
            shape: "pill",
            width: 300
        }

    );

}


async function googleLogin(response) {

    if (
        !response ||
        !response.credential
    ) {

        loginError(
            "Google لم يرجع بيانات صحيحة."
        );

        return;
    }


    try {

        const result =
            await api(
                "google_login",
                {
                    credential:
                        response.credential
                }
            );


        if (!result.success) {

            throw new Error(
                result.message ||
                "فشل تسجيل الدخول"
            );

        }


        currentUser =
            result.user;


        showApp();

        await loadMessages();

        if (
            currentUser.role ===
            "admin"
        ) {

            await loadUsers();

        }


        startPolling();


    } catch(error) {

        console.error(error);

        loginError(
            error.message
        );

    }

}


/* =====================================================
   API
===================================================== */

async function api(
    action,
    data = {}
) {

    const response =
        await fetch(
            API_URL,
            {
                method: "POST",

                credentials: "include",

                headers: {
                    "Content-Type":
                        "application/json",

                    "Accept":
                        "application/json"
                },

                body:
                    JSON.stringify({
                        action,
                        ...data
                    })
            }
        );


    const text =
        await response.text();


    let result;

    try {

        result =
            JSON.parse(text);

    } catch(e) {

        console.error(text);

        throw new Error(
            "الـPHP Backend لم يرجع JSON صحيح."
        );

    }


    return result;
}


/* =====================================================
   SHOW APP
===================================================== */

function showApp() {

    document
        .getElementById("loginPage")
        .classList.add("hidden");


    document
        .getElementById("app")
        .classList.remove("hidden");


    document
        .getElementById("userName")
        .textContent =
            currentUser.name;


    document
        .getElementById("userRole")
        .textContent =

            currentUser.role === "admin"
                ? "Administrator"
                : "Guest";


    if (currentUser.picture) {

        document
            .getElementById("avatar")
            .src =
                currentUser.picture;

    }


    if (
        currentUser.role === "admin"
    ) {

        document
            .getElementById("adminPanel")
            .classList.remove("hidden");


        document
            .getElementById("quota")
            .textContent = "∞";

    } else {

        updateQuota(
            currentUser.quota
        );

    }


    updateControls();
}


/* =====================================================
   QUOTA
===================================================== */

function updateQuota(value) {

    currentUser.quota =
        Number(value);


    document
        .getElementById("quota")
        .textContent =
            currentUser.quota;


    updateControls();
}


/* =====================================================
   CONTROLS
===================================================== */

function updateControls() {

    const input =
        document.getElementById(
            "messageInput"
        );


    const send =
        document.getElementById(
            "sendButton"
        );


    const logout =
        document.getElementById(
            "logoutButton"
        );


    if (
        currentUser.role ===
        "admin"
    ) {

        input.disabled = false;
        send.disabled = false;
        logout.disabled = false;

        return;
    }


    const zero =
        Number(
            currentUser.quota
        ) <= 0;


    input.disabled =
        zero;


    send.disabled =
        zero;


    /*
     * حسب طلبك:
     * عند انتهاء الكوست
     * زر الخروج يتوقف
     */
    logout.disabled =
        zero;


    if (zero) {

        input.placeholder =
            "انتهى رصيد الرسائل";

    } else {

        input.placeholder =
            "اكتب رسالتك...";

    }

}


/* =====================================================
   SEND MESSAGE
===================================================== */

async function sendMessage() {

    if (!currentUser) {
        return;
    }


    const input =
        document.getElementById(
            "messageInput"
        );


    const text =
        input.value.trim();


    if (!text) {
        return;
    }


    if (
        currentUser.role !== "admin" &&
        Number(currentUser.quota) <= 0
    ) {

        notify(
            "انتهى رصيد الرسائل."
        );

        return;
    }


    input.disabled = true;


    try {

        const result =
            await api(
                "send_message",
                {
                    message: text
                }
            );


        if (!result.success) {

            throw new Error(
                result.message ||
                "فشل إرسال الرسالة"
            );

        }


        input.value = "";


        if (
            currentUser.role !== "admin"
        ) {

            updateQuota(
                result.remaining
            );

        }


        await loadMessages();


        /*
         * اطلب الرد من LiteLLM
         */
        const ai =
            await api(
                "ai",
                {
                    message: text
                }
            );


        if (ai.success && ai.answer) {

            addMessage(
                {
                    sender_name:
                        "REMO AI",

                    sender_email:
                        "ai",

                    message:
                        ai.answer,

                    type:
                        "ai"
                }
            );

        }


    } catch(error) {

        console.error(error);

        notify(
            error.message
        );

    }


    updateControls();
}


/* =====================================================
   LOAD MESSAGES
===================================================== */

async function loadMessages() {

    if (!currentUser) {
        return;
    }


    try {

        const result =
            await api(
                "get_messages"
            );


        if (!result.success) {
            return;
        }


        renderMessages(
            result.messages || []
        );


    } catch(error) {

        console.error(error);

    }

}


/* =====================================================
   RENDER
===================================================== */

function renderMessages(messages) {

    const box =
        document.getElementById(
            "messages"
        );


    box.innerHTML = "";


    messages.forEach(
        message => {

            addMessage(
                message,
                false
            );

        }
    );


    box.scrollTop =
        box.scrollHeight;
}


function addMessage(
    message,
    scroll = true
) {

    const box =
        document.getElementById(
            "messages"
        );


    const div =
        document.createElement(
            "div"
        );


    if (
        message.type === "ai"
    ) {

        div.className =
            "message ai";

    } else {

        const mine =
            String(
                message.sender_email
            ).toLowerCase() ===
            String(
                currentUser.email
            ).toLowerCase();


        div.className =
            "message " +
            (
                mine
                    ? "me"
                    : "other"
            );

    }


    const text =
        document.createElement(
            "div"
        );


    text.textContent =
        message.message || "";


    const meta =
        document.createElement(
            "div"
        );


    meta.className =
        "message-meta";


    meta.textContent =
        message.sender_name ||
        message.sender_email ||
        "";


    div.appendChild(text);
    div.appendChild(meta);


    box.appendChild(div);


    if (scroll) {

        box.scrollTop =
            box.scrollHeight;

    }

}


/* =====================================================
   ADMIN USERS
===================================================== */

async function loadUsers() {

    if (
        currentUser.role !== "admin"
    ) {

        return;
    }


    const result =
        await api(
            "get_users"
        );


    if (!result.success) {
        return;
    }


    const box =
        document.getElementById(
            "usersList"
        );


    box.innerHTML = "";


    result.users.forEach(
        user => {

            if (
                user.email.toLowerCase() ===
                ADMIN_EMAIL.toLowerCase()
            ) {
                return;
            }


            const div =
                document.createElement(
                    "div"
                );


            div.className =
                "admin-user";


            div.innerHTML = `
                <strong>
                    ${escapeHtml(user.name)}
                </strong>

                <br>

                <small>
                    ${escapeHtml(user.email)}
                </small>

                <br>

                <small>
                    المتبقي:
                    <b>${Number(user.quota)}</b>
                </small>

                <div class="admin-actions">

                    <input
                        type="number"
                        min="1"
                        value="100"
                        id="amount-${encodeURIComponent(user.email)}"
                    >

                    <button
                        onclick="addQuota(
                            '${encodeURIComponent(user.email)}'
                        )"
                    >
                        + إضافة
                    </button>

                </div>
            `;


            box.appendChild(div);

        }
    );

}


/* =====================================================
   ADD QUOTA
===================================================== */

async function addQuota(
    encodedEmail
) {

    const email =
        decodeURIComponent(
            encodedEmail
        );


    const input =
        document.getElementById(
            "amount-" +
            encodeURIComponent(email)
        );


    const amount =
        Number(
            input.value
        );


    if (
        !amount ||
        amount <= 0
    ) {

        notify(
            "اكتب عدد صحيح."
        );

        return;
    }


    try {

        const result =
            await api(
                "add_quota",
                {
                    email,
                    amount
                }
            );


        if (!result.success) {

            throw new Error(
                result.message
            );

        }


        notify(
            "تمت إضافة " +
            amount +
            " رسالة."
        );


        await loadUsers();


    } catch(error) {

        notify(
            error.message
        );

    }

}


/* =====================================================
   LOGOUT
===================================================== */

async function logout() {

    if (
        currentUser.role !== "admin" &&
        Number(currentUser.quota) <= 0
    ) {

        notify(
            "لا يمكنك تسجيل الخروج بعد انتهاء الكوست."
        );

        return;
    }


    try {

        await api(
            "logout"
        );

    } catch(error) {

        console.error(error);

    }


    if (pollTimer) {

        clearInterval(
            pollTimer
        );

        pollTimer = null;
    }


    currentUser = null;


    document
        .getElementById("app")
        .classList.add("hidden");


    document
        .getElementById("loginPage")
        .classList.remove("hidden");


    document
        .getElementById("messages")
        .innerHTML = "";


    document
        .getElementById("usersList")
        .innerHTML = "";


    document
        .getElementById("loginError")
        .textContent = "";


    if (
        window.google &&
        google.accounts &&
        google.accounts.id
    ) {

        google.accounts.id.disableAutoSelect();

    }

}


/* =====================================================
   POLLING
===================================================== */

function startPolling() {

    if (pollTimer) {

        clearInterval(
            pollTimer
        );

    }


    pollTimer =
        setInterval(
            async () => {

                if (!currentUser) {
                    return;
                }


                await loadMessages();


                /*
                 * نجيب بيانات المستخدم
                 * عشان الـquota تتحدث
                 */
                const me =
                    await api(
                        "me"
                    );


                if (
                    me.success &&
                    me.user
                ) {

                    currentUser =
                        me.user;


                    if (
                        currentUser.role ===
                        "admin"
                    ) {

                        document
                            .getElementById(
                                "quota"
                            )
                            .textContent =
                                "∞";

                        await loadUsers();

                    } else {

                        updateQuota(
                            currentUser.quota
                        );

                    }

                }


            },
            5000
        );
}


/* =====================================================
   NOTIFICATION
===================================================== */

function notify(text) {

    const box =
        document.getElementById(
            "notification"
        );


    box.textContent =
        text;


    box.classList.remove(
        "hidden"
    );


    setTimeout(
        () => {

            box.classList.add(
                "hidden"
            );

        },
        3000
    );

}


function loginError(text) {

    document
        .getElementById(
            "loginError"
        )
        .textContent =
            text || "";

}


function escapeHtml(value) {

    return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");

}


/* =====================================================
   ENTER
===================================================== */

document
    .getElementById("messageInput")
    .addEventListener(
        "keydown",
        event => {

            if (
                event.key === "Enter" &&
                !event.shiftKey
            ) {

                event.preventDefault();

                sendMessage();

            }

        }
    );

</script>

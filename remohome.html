<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>REMO AI</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            font-family:
                Tahoma,
                Arial,
                sans-serif;

            color: #fff;

            background:
                radial-gradient(
                    circle at top right,
                    #312e81,
                    transparent 35%
                ),
                radial-gradient(
                    circle at bottom left,
                    #164e63,
                    transparent 35%
                ),
                #020617;
        }


        /* =========================
           LOGIN
        ========================= */

        #loginPage {
            min-height: 100vh;

            display: flex;

            align-items: center;
            justify-content: center;

            padding: 20px;
        }


        .login {
            width: 100%;
            max-width: 420px;

            padding: 35px;

            border-radius: 25px;

            background:
                rgba(255, 255, 255, .07);

            border:
                1px solid
                rgba(255, 255, 255, .12);

            backdrop-filter:
                blur(20px);

            box-shadow:
                0 30px 80px
                rgba(0, 0, 0, .5);
        }


        .logo {
            text-align: center;

            font-size: 50px;

            font-weight: 900;

            letter-spacing: 4px;
        }


        .logo span {
            color: #818cf8;
        }


        .subtitle {
            text-align: center;

            color: #94a3b8;

            margin-bottom: 30px;
        }


        input,
        textarea {
            width: 100%;

            border: none;
            outline: none;

            color: #fff;

            background:
                rgba(0, 0, 0, .3);

            border:
                1px solid
                rgba(255, 255, 255, .1);

            border-radius: 14px;

            padding: 15px;

            font-size: 15px;
        }


        button {
            border: none;

            cursor: pointer;

            color: #fff;

            background: #6366f1;

            padding: 13px 20px;

            border-radius: 13px;

            font-weight: bold;

            transition: .2s;
        }


        button:hover {
            transform:
                translateY(-2px);

            filter:
                brightness(1.1);
        }


        button:disabled {
            opacity: .45;

            cursor: not-allowed;

            transform: none;

            filter: none;
        }


        .login button {
            width: 100%;

            margin-top: 15px;
        }


        /* =========================
           APP
        ========================= */

        #app {
            display: none;
        }


        /* =========================
           TOP BAR
        ========================= */

        .topBar {
            position: sticky;

            top: 0;

            z-index: 100;

            height: 70px;

            display: flex;

            align-items: center;

            justify-content: space-between;

            padding: 0 25px;

            background:
                rgba(2, 6, 23, .92);

            border-bottom:
                1px solid
                rgba(255, 255, 255, .08);

            backdrop-filter:
                blur(15px);
        }


        .brand {
            font-size: 25px;

            font-weight: 900;
        }


        .userInfo {
            display: flex;

            align-items: center;

            gap: 15px;
        }


        .userInfo button {
            background: #ef4444;

            padding:
                9px 15px;
        }


        /* =========================
           QUOTA
        ========================= */

        .quotaContainer {
            position: fixed;

            top: 70px;

            left: 0;
            right: 0;

            z-index: 90;

            height: 48px;

            padding:
                7px 15px;

            background:
                rgba(15, 23, 42, .96);

            border-bottom:
                1px solid
                rgba(255, 255, 255, .08);
        }


        .quotaInfo {
            max-width: 1200px;

            margin: auto;

            height: 100%;

            display: flex;

            align-items: center;

            gap: 15px;
        }


        .quotaText {
            min-width: 180px;

            font-size: 13px;

            font-weight: bold;
        }


        .quotaUnlimited {
            color: #4ade80;
        }


        .progress {
            flex: 1;

            height: 9px;

            overflow: hidden;

            border-radius: 20px;

            background:
                rgba(255, 255, 255, .1);
        }


        .progressBar {
            height: 100%;

            width: 100%;

            border-radius: 20px;

            background: #6366f1;

            transition:
                width .3s ease;
        }


        /* =========================
           MAIN
        ========================= */

        .container {
            width: 100%;

            max-width: 1200px;

            margin: auto;

            padding:
                145px 20px 30px;
        }


        /* =========================
           CARDS
        ========================= */

        .cards {
            display: grid;

            grid-template-columns:
                repeat(
                    auto-fit,
                    minmax(200px, 1fr)
                );

            gap: 18px;

            margin-bottom: 20px;
        }


        .card {
            padding: 22px;

            border-radius: 20px;

            background:
                rgba(255, 255, 255, .06);

            border:
                1px solid
                rgba(255, 255, 255, .08);
        }


        .card small {
            color: #94a3b8;
        }


        .card strong {
            display: block;

            font-size: 28px;

            margin-top: 8px;
        }


        /* =========================
           CHAT
        ========================= */

        .chat {
            border-radius: 22px;

            background:
                rgba(255, 255, 255, .06);

            border:
                1px solid
                rgba(255, 255, 255, .08);

            padding: 20px;
        }


        .messages {
            height: 430px;

            overflow-y: auto;

            padding: 10px;
        }


        .message {
            max-width: 80%;

            padding:
                13px 16px;

            margin:
                12px 0;

            border-radius: 16px;

            line-height: 1.8;

            white-space: pre-wrap;
        }


        .message.user {
            margin-right: auto;

            background:
                rgba(99, 102, 241, .25);
        }


        .message.ai {
            margin-left: auto;

            background:
                rgba(255, 255, 255, .08);
        }


        .chatInput {
            display: flex;

            gap: 10px;

            margin-top: 15px;
        }


        .chatInput textarea {
            height: 60px;

            resize: none;
        }


        .chatInput button {
            min-width: 100px;
        }


        /* =========================
           API
        ========================= */

        .api {
            margin-top: 20px;

            padding: 20px;

            border-radius: 20px;

            background:
                rgba(255, 255, 255, .06);

            border:
                1px solid
                rgba(255, 255, 255, .08);
        }


        .key {
            direction: ltr;

            text-align: left;

            margin-top: 15px;

            padding: 15px;

            border-radius: 12px;

            background: #020617;

            font-family: monospace;

            word-break: break-all;
        }


        pre {
            direction: ltr;

            text-align: left;

            background: #020617;

            padding: 15px;

            border-radius: 12px;

            overflow-x: auto;

            white-space: pre-wrap;
        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 700px) {

            .topBar {
                padding: 0 12px;
            }

            .userInfo {
                font-size: 12px;
            }

            .quotaInfo {
                gap: 8px;
            }

            .quotaText {
                min-width: 130px;

                font-size: 11px;
            }

            .container {
                padding-top: 135px;
            }

            .chatInput {
                flex-direction: column;
            }

            .chatInput button {
                width: 100%;
            }

            .message {
                max-width: 95%;
            }
        }

    </style>
</head>


<body>


<!-- =====================================================
     LOGIN
===================================================== -->

<div id="loginPage">

    <div class="login">

        <div class="logo">
            REM<span>O</span>
        </div>

        <div class="subtitle">
            AI Assistant
        </div>

        <input
            id="username"
            type="text"
            placeholder="اكتب اسمك"
            autocomplete="off"
        >

        <button onclick="login()">
            دخول إلى REMO
        </button>

    </div>

</div>



<!-- =====================================================
     APP
===================================================== -->

<div id="app">


    <!-- TOP BAR -->

    <header class="topBar">

        <div class="brand">
            REMO
        </div>


        <div class="userInfo">

            <span>
                أهلاً
                <b id="currentUser"></b>
            </span>

            <span id="currentRole"></span>

            <button onclick="logout()">
                خروج
            </button>

        </div>

    </header>



    <!-- QUOTA -->

    <div class="quotaContainer">

        <div class="quotaInfo">

            <div
                id="quotaText"
                class="quotaText"
            >
                متبقي 700 من 700 رسالة
            </div>


            <div
                id="progressContainer"
                class="progress"
            >

                <div
                    id="progressBar"
                    class="progressBar"
                ></div>

            </div>

        </div>

    </div>



    <!-- MAIN -->

    <div class="container">


        <!-- STATS -->

        <div class="cards">


            <div class="card">

                <small>
                    المستخدم
                </small>

                <strong id="statUser">
                    -
                </strong>

            </div>


            <div class="card">

                <small>
                    النوع
                </small>

                <strong id="statRole">
                    -
                </strong>

            </div>


            <div class="card">

                <small>
                    الرسائل المستخدمة
                </small>

                <strong id="statRequests">
                    0
                </strong>

            </div>


            <div class="card">

                <small>
                    الرسائل المتبقية
                </small>

                <strong id="statRemaining">
                    700
                </strong>

            </div>

        </div>



        <!-- CHAT -->

        <div class="chat">

            <h2>
                🤖 تحدث مع ريمو
            </h2>


            <div
                id="messages"
                class="messages"
            >

                <div class="message ai">
                    أهلاً 👋

                    أنا ريمو.

                    اكتب رسالتك للبدء.
                </div>

            </div>


            <div class="chatInput">

                <textarea
                    id="messageInput"
                    placeholder="اكتب رسالتك..."
                ></textarea>


                <button
                    id="sendButton"
                    onclick="sendMessage()"
                >
                    إرسال
                </button>

            </div>

        </div>



        <!-- API -->

        <div class="api">

            <h2>
                🔑 REMO API
            </h2>

            <p>
                إنشاء API Key تجريبي.
            </p>


            <button onclick="generateAPIKey()">
                إنشاء API Key
            </button>


            <div
                id="apiKeyBox"
                class="key"
                style="display:none"
            ></div>


            <h3>
                مثال الاستخدام
            </h3>


            <pre id="apiExample">اضغط "إنشاء API Key" للحصول على مثال الاستخدام.</pre>

        </div>

    </div>

</div>



<script>

/*
===========================================================
 REMO CONFIG
===========================================================
*/

const LITELLM_URL =
    "https://sheet-corrections-famous-bar.trycloudflare.com                                    ";


/*
===========================================================
 SETTINGS
===========================================================
*/

const USER_LIMIT = 700;


/*
===========================================================
 STATE
===========================================================
*/

let user = null;

let messages = [];

let usedMessages = 0;

let apiKey = null;


/*
===========================================================
 LOGIN
===========================================================
*/

function login() {

    const input =
        document.getElementById("username");


    const name =
        input.value.trim();


    if (!name) {

        alert("اكتب اسمك أولاً");

        return;
    }


    /*
    -----------------------------------------
    Adam = Admin
    -----------------------------------------
    */

    const isAdmin =
        name.toLowerCase() === "adam";


    user = {

        username: name,

        role:
            isAdmin
                ? "admin"
                : "user"
    };


    /*
    -----------------------------------------
    Load usage
    -----------------------------------------
    */

    const savedUsage =
        localStorage.getItem(
            "remo_usage_" +
            name.toLowerCase()
        );


    usedMessages =
        savedUsage
            ? parseInt(savedUsage, 10)
            : 0;


    /*
    -----------------------------------------
    Save current user
    -----------------------------------------
    */

    localStorage.setItem(
        "remo_user",
        JSON.stringify(user)
    );


    showApp();
}


/*
===========================================================
 SHOW APP
===========================================================
*/

function showApp() {

    document
        .getElementById("loginPage")
        .style.display = "none";


    document
        .getElementById("app")
        .style.display = "block";


    document
        .getElementById("currentUser")
        .textContent =
            user.username;


    document
        .getElementById("currentRole")
        .textContent =
            user.role === "admin"
                ? "👑 Admin"
                : "👤 User";


    document
        .getElementById("statUser")
        .textContent =
            user.username;


    document
        .getElementById("statRole")
        .textContent =
            user.role === "admin"
                ? "Admin"
                : "User";


    updateQuota();
}


/*
===========================================================
 UPDATE QUOTA
===========================================================
*/

function updateQuota() {

    const quotaText =
        document.getElementById(
            "quotaText"
        );


    const progressBar =
        document.getElementById(
            "progressBar"
        );


    const statRequests =
        document.getElementById(
            "statRequests"
        );


    const statRemaining =
        document.getElementById(
            "statRemaining"
        );


    const sendButton =
        document.getElementById(
            "sendButton"
        );


    const messageInput =
        document.getElementById(
            "messageInput"
        );


    /*
    ==========================================
    ADMIN
    ==========================================
    */

    if (
        user &&
        user.role === "admin"
    ) {

        quotaText.textContent =
            "∞ لا نهائية — Admin";


        quotaText.className =
            "quotaText quotaUnlimited";


        progressBar.style.width =
            "100%";


        progressBar.style.background =
            "#4ade80";


        statRequests.textContent =
            usedMessages;


        statRemaining.textContent =
            "∞";


        sendButton.disabled =
            false;


        messageInput.disabled =
            false;


        messageInput.placeholder =
            "اكتب رسالتك إلى ريمو...";


        return;
    }


    /*
    ==========================================
    USER
    ==========================================
    */

    const remaining =
        Math.max(
            0,
            USER_LIMIT -
            usedMessages
        );


    const percentage =
        (
            remaining /
            USER_LIMIT
        ) * 100;


    quotaText.textContent =
        `متبقي ${remaining} من ${USER_LIMIT} رسالة`;


    quotaText.className =
        "quotaText";


    progressBar.style.width =
        percentage + "%";


    progressBar.style.background =
        remaining <= 50
            ? "#ef4444"
            : "#6366f1";


    statRequests.textContent =
        usedMessages;


    statRemaining.textContent =
        remaining;


    /*
    ------------------------------------------
    Limit reached
    ------------------------------------------
    */

    if (remaining <= 0) {

        sendButton.disabled =
            true;


        messageInput.disabled =
            true;


        messageInput.placeholder =
            "🚫 انتهت رسائلك الـ700";

    } else {

        sendButton.disabled =
            false;


        messageInput.disabled =
            false;


        messageInput.placeholder =
            "اكتب رسالتك...";
    }
}


/*
===========================================================
 SAVE USAGE
===========================================================
*/

function saveUsage() {

    if (!user) {
        return;
    }


    localStorage.setItem(

        "remo_usage_" +
        user.username.toLowerCase(),

        String(usedMessages)
    );
}


/*
===========================================================
 ADD MESSAGE
===========================================================
*/

function addMessage(
    text,
    type
) {

    const container =
        document.getElementById(
            "messages"
        );


    const div =
        document.createElement(
            "div"
        );


    div.className =
        "message " + type;


    div.textContent =
        text;


    container.appendChild(div);


    container.scrollTop =
        container.scrollHeight;
}


/*
===========================================================
 SEND MESSAGE
===========================================================
*/

async function sendMessage() {

    if (!user) {
        return;
    }


    /*
    -----------------------------------------
    Check quota
    -----------------------------------------
    */

    if (
        user.role !== "admin" &&
        usedMessages >= USER_LIMIT
    ) {

        alert(
            "🚫 انتهت رسائلك الـ700."
        );

        updateQuota();

        return;
    }


    const input =
        document.getElementById(
            "messageInput"
        );


    const text =
        input.value.trim();


    if (!text) {
        return;
    }


    /*
    -----------------------------------------
    Add user message
    -----------------------------------------
    */

    addMessage(
        text,
        "user"
    );


    input.value = "";


    messages.push({

        role: "user",

        content: text

    });


    /*
    -----------------------------------------
    Count
    -----------------------------------------
    */

    if (
        user.role !== "admin"
    ) {

        usedMessages++;

        saveUsage();

        updateQuota();
    }


    /*
    -----------------------------------------
    Loading
    -----------------------------------------
    */

    const loading =
        document.createElement(
            "div"
        );


    loading.className =
        "message ai";


    loading.id =
        "loading";


    loading.textContent =
        "ريمو بيفكر...";


    document
        .getElementById("messages")
        .appendChild(loading);


    try {

        /*
        ======================================
        LiteLLM
        ======================================
        */

        const response =
            await fetch(

                LITELLM_URL +
                "/v1/chat/completions",

                {

                    method: "POST",

                    headers: {

                        "Content-Type":
                            "application/json"

                    },

                    body:
                        JSON.stringify({

                            model: "remo",

                            messages:
                                messages,

                            temperature: 0.3

                        })

                }
            );


        const data =
            await response.json();


        /*
        --------------------------------------
        Remove loading
        --------------------------------------
        */

        const loadingElement =
            document.getElementById(
                "loading"
            );


        if (loadingElement) {
            loadingElement.remove();
        }


        /*
        --------------------------------------
        Error
        --------------------------------------
        */

        if (!response.ok) {

            addMessage(

                "❌ حصل خطأ من LiteLLM:\n\n" +
                (
                    data?.error?.message
                    ||
                    JSON.stringify(data)
                ),

                "ai"
            );

            return;
        }


        /*
        --------------------------------------
        AI response
        --------------------------------------
        */

        const answer =
            data
                ?.choices
                ?.[0]
                ?.message
                ?.content;


        if (!answer) {

            addMessage(
                "❌ ريمو لم يرجع ردًا صحيحًا.",
                "ai"
            );

            console.log(data);

            return;
        }


        addMessage(
            answer,
            "ai"
        );


        messages.push({

            role: "assistant",

            content: answer

        });


    } catch (error) {

        const loadingElement =
            document.getElementById(
                "loading"
            );


        if (loadingElement) {
            loadingElement.remove();
        }


        addMessage(

            "❌ لا أستطيع الاتصال بـ LiteLLM.\n\n" +
            "تأكد أن LiteLLM شغال على Port 4000 وأن Cloudflare Tunnel شغال.",

            "ai"
        );


        console.error(error);
    }
}


/*
===========================================================
 ENTER TO SEND
===========================================================
*/

document
    .getElementById("messageInput")
    .addEventListener(
        "keydown",
        function(event) {

            if (
                event.key === "Enter" &&
                !event.shiftKey
            ) {

                event.preventDefault();

                sendMessage();
            }

        }
    );


/*
===========================================================
 GENERATE API KEY
===========================================================
*/

function generateAPIKey() {

    const random =
        crypto
            .randomUUID()
            .replaceAll("-", "");


    apiKey =
        "sk-remo-" +
        random;


    const box =
        document.getElementById(
            "apiKeyBox"
        );


    box.style.display =
        "block";


    box.textContent =
        apiKey;


    document
        .getElementById(
            "apiExample"
        )
        .textContent =

`fetch("${LITELLM_URL}/v1/chat/completions", {

    method: "POST",

    headers: {

        "Content-Type":
            "application/json",

        "Authorization":
            "Bearer ${apiKey}"

    },

    body: JSON.stringify({

        model: "remo",

        messages: [

            {
                role: "user",

                content:
                    "أهلاً يا ريمو"
            }

        ]

    })

});`;
}


/*
===========================================================
 LOGOUT
===========================================================
*/

function logout() {

    /*
    -----------------------------------------
    IMPORTANT:
    لا نمسح عداد الرسائل.
    -----------------------------------------
    */

    localStorage.removeItem(
        "remo_user"
    );


    /*
    -----------------------------------------
    Reset current session
    -----------------------------------------
    */

    user = null;

    messages = [];

    usedMessages = 0;

    apiKey = null;


    /*
    -----------------------------------------
    Hide app
    -----------------------------------------
    */

    document
        .getElementById("app")
        .style.display = "none";


    /*
    -----------------------------------------
    Show login
    -----------------------------------------
    */

    document
        .getElementById("loginPage")
        .style.display = "flex";


    /*
    -----------------------------------------
    Clear login
    -----------------------------------------
    */

    document
        .getElementById("username")
        .value = "";


    /*
    -----------------------------------------
    Reset chat
    -----------------------------------------
    */

    document
        .getElementById("messages")
        .innerHTML = `

            <div class="message ai">

                أهلاً 👋

                أنا ريمو.

                اكتب رسالتك للبدء.

            </div>

        `;


    /*
    -----------------------------------------
    Reset API
    -----------------------------------------
    */

    document
        .getElementById("apiKeyBox")
        .style.display = "none";


    document
        .getElementById("apiKeyBox")
        .textContent = "";


    document
        .getElementById("apiExample")
        .textContent =
            'اضغط "إنشاء API Key" للحصول على مثال الاستخدام.';


    /*
    -----------------------------------------
    Focus username
    -----------------------------------------
    */

    setTimeout(() => {

        document
            .getElementById("username")
            .focus();

    }, 100);
}


/*
===========================================================
 AUTO LOGIN
===========================================================
*/

const savedUser =
    localStorage.getItem(
        "remo_user"
    );


if (savedUser) {

    try {

        user =
            JSON.parse(savedUser);


        const savedUsage =
            localStorage.getItem(

                "remo_usage_" +
                user.username.toLowerCase()

            );


        usedMessages =
            savedUsage
                ? parseInt(
                    savedUsage,
                    10
                )
                : 0;


        showApp();

    } catch (error) {

        localStorage.removeItem(
            "remo_user"
        );

        console.error(error);
    }
}

</script>

</body>
</html>

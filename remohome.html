<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>REMO AI</title>

    <script src="https://accounts.google.com/gsi/client" async defer></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, Tahoma, sans-serif;
            background:
                radial-gradient(circle at top right, #243b70 0%, transparent 35%),
                radial-gradient(circle at bottom left, #111c3a 0%, transparent 35%),
                #070b16;
            color: #fff;
        }

        button,
        input,
        textarea {
            font-family: inherit;
        }

        .hidden {
            display: none !important;
        }

        /* LOGIN */

        #loginScreen {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-card {
            width: min(430px, 100%);
            padding: 40px 30px;
            text-align: center;
            border: 1px solid rgba(255,255,255,.12);
            border-radius: 28px;
            background: rgba(15,20,35,.82);
            backdrop-filter: blur(20px);
            box-shadow: 0 30px 80px rgba(0,0,0,.45);
        }

        .logo {
            width: 76px;
            height: 76px;
            margin: 0 auto 20px;
            border-radius: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 38px;
            font-weight: bold;
            background: linear-gradient(135deg,#635bff,#00b7ff);
        }

        .login-card h1 {
            margin: 0 0 10px;
            font-size: 30px;
        }

        .login-card p {
            color: #aeb8d0;
            margin-bottom: 30px;
        }

        #googleButton {
            display: flex;
            justify-content: center;
            min-height: 44px;
        }

        .error {
            color: #ff7b8a;
            margin-top: 15px;
            font-size: 14px;
        }

        /* APP */

        #app {
            min-height: 100vh;
        }

        .topbar {
            position: sticky;
            top: 0;
            z-index: 50;
            min-height: 70px;
            padding: 12px 22px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            border-bottom: 1px solid rgba(255,255,255,.08);
            background: rgba(7,11,22,.82);
            backdrop-filter: blur(18px);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: bold;
        }

        .mini-logo {
            width: 40px;
            height: 40px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg,#635bff,#00b7ff);
        }

        .user-area {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .user-avatar {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            object-fit: cover;
        }

        .quota {
            padding: 9px 14px;
            border-radius: 12px;
            background: rgba(255,255,255,.08);
            color: #dce5ff;
            font-size: 13px;
        }

        .logout {
            border: 0;
            border-radius: 10px;
            padding: 9px 13px;
            cursor: pointer;
            color: white;
            background: #e5484d;
        }

        .logout:disabled {
            opacity: .45;
            cursor: not-allowed;
        }

        .layout {
            width: min(1250px, 100%);
            margin: auto;
            padding: 25px;
            display: grid;
            grid-template-columns: 280px 1fr;
            gap: 20px;
        }

        .panel {
            border: 1px solid rgba(255,255,255,.09);
            border-radius: 22px;
            background: rgba(15,20,35,.75);
            backdrop-filter: blur(18px);
        }

        .sidebar {
            padding: 20px;
        }

        .profile {
            text-align: center;
            padding-bottom: 20px;
            border-bottom: 1px solid rgba(255,255,255,.08);
        }

        .profile img {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            object-fit: cover;
        }

        .profile h3 {
            margin: 10px 0 4px;
        }

        .profile small {
            color: #8e99b5;
            word-break: break-word;
        }

        .role {
            display: inline-block;
            margin-top: 10px;
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 12px;
            background: rgba(99,91,255,.2);
            color: #a9a2ff;
        }

        .side-button {
            width: 100%;
            margin-top: 12px;
            padding: 12px;
            border: 0;
            border-radius: 12px;
            cursor: pointer;
            color: white;
            background: rgba(255,255,255,.07);
        }

        .side-button:hover {
            background: rgba(255,255,255,.12);
        }

        /* CHAT */

        .chat-panel {
            min-height: 700px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .chat-header {
            padding: 18px 20px;
            border-bottom: 1px solid rgba(255,255,255,.08);
        }

        .chat-header h2 {
            margin: 0 0 5px;
        }

        .chat-header span {
            color: #8e99b5;
            font-size: 13px;
        }

        #messages {
            flex: 1;
            min-height: 500px;
            max-height: 600px;
            overflow-y: auto;
            padding: 25px;
        }

        .message {
            max-width: 80%;
            margin-bottom: 15px;
            padding: 13px 16px;
            border-radius: 17px;
            line-height: 1.7;
            white-space: pre-wrap;
        }

        .message.user {
            margin-right: auto;
            background: linear-gradient(135deg,#635bff,#4361ee);
        }

        .message.ai {
            margin-left: auto;
            background: rgba(255,255,255,.08);
        }

        .message.system {
            max-width: 100%;
            text-align: center;
            color: #8e99b5;
            background: transparent;
        }

        .composer {
            padding: 18px;
            display: flex;
            gap: 10px;
            border-top: 1px solid rgba(255,255,255,.08);
        }

        #prompt {
            flex: 1;
            min-height: 50px;
            max-height: 140px;
            resize: vertical;
            padding: 14px;
            border: 1px solid rgba(255,255,255,.1);
            outline: none;
            border-radius: 14px;
            color: white;
            background: rgba(0,0,0,.2);
        }

        #sendButton {
            width: 110px;
            border: 0;
            border-radius: 14px;
            cursor: pointer;
            color: white;
            background: linear-gradient(135deg,#635bff,#00a8ff);
        }

        #sendButton:disabled {
            opacity: .5;
            cursor: not-allowed;
        }

        /* ADMIN */

        #adminPanel {
            width: min(1250px, calc(100% - 50px));
            margin: 0 auto 30px;
            padding: 20px;
        }

        .admin-title {
            margin-bottom: 15px;
        }

        .users-table {
            width: 100%;
            border-collapse: collapse;
        }

        .users-table th,
        .users-table td {
            padding: 12px;
            text-align: right;
            border-bottom: 1px solid rgba(255,255,255,.08);
        }

        .users-table th {
            color: #9aa6c2;
        }

        .quota-input {
            width: 90px;
            padding: 8px;
            border: 1px solid rgba(255,255,255,.12);
            border-radius: 8px;
            outline: none;
            color: white;
            background: #101728;
        }

        .add-quota {
            padding: 8px 12px;
            border: 0;
            border-radius: 8px;
            cursor: pointer;
            color: white;
            background: #2f9e44;
        }

        .notification {
            position: fixed;
            left: 20px;
            bottom: 20px;
            z-index: 100;
            max-width: 340px;
            padding: 15px 18px;
            border-radius: 14px;
            background: #1c2540;
            box-shadow: 0 15px 40px rgba(0,0,0,.4);
            display: none;
        }

        @media(max-width: 800px) {
            .layout {
                grid-template-columns: 1fr;
                padding: 12px;
            }

            .sidebar {
                order: 2;
            }

            .chat-panel {
                min-height: 600px;
            }

            #messages {
                min-height: 400px;
            }

            .topbar {
                padding: 10px;
            }

            .user-email {
                display: none;
            }

            #adminPanel {
                width: calc(100% - 24px);
            }
        }
    </style>
</head>

<body>

<!-- LOGIN -->
<section id="loginScreen">

    <div class="login-card">

        <div class="logo">R</div>

        <h1>REMO AI</h1>

        <p>سجل الدخول باستخدام حساب Google</p>

        <div id="googleButton"></div>

        <div id="loginError" class="error"></div>

    </div>

</section>


<!-- APP -->
<div id="app" class="hidden">

    <header class="topbar">

        <div class="brand">
            <div class="mini-logo">R</div>
            <span>REMO AI</span>
        </div>

        <div class="user-area">

            <div id="quotaBox" class="quota">
                المتبقي: ...
            </div>

            <img id="topAvatar"
                 class="user-avatar"
                 src=""
                 alt="">

            <span id="topName" class="user-email"></span>

            <button id="logoutButton"
                    class="logout"
                    onclick="logout()">
                خروج
            </button>

        </div>

    </header>


    <main class="layout">

        <aside class="sidebar panel">

            <div class="profile">

                <img id="profileAvatar"
                     src=""
                     alt="">

                <h3 id="profileName">-</h3>

                <small id="profileEmail">-</small>

                <div id="profileRole" class="role">
                    Guest
                </div>

            </div>

            <button class="side-button"
                    onclick="openAdminMessages()">
                💬 رسائل الإدارة
            </button>

            <button id="adminButton"
                    class="side-button hidden"
                    onclick="loadUsers()">
                👑 إدارة المستخدمين
            </button>

        </aside>


        <section class="chat-panel panel">

            <div class="chat-header">

                <h2>REMO AI</h2>

                <span>
                    اسأل الذكاء الاصطناعي
                </span>

            </div>


            <div id="messages">

                <div class="message system">
                    أهلاً بك في REMO AI 👋
                </div>

            </div>


            <div class="composer">

                <textarea
                    id="prompt"
                    placeholder="اكتب رسالتك هنا..."
                    onkeydown="handleKey(event)"
                ></textarea>

                <button
                    id="sendButton"
                    onclick="sendMessage()">
                    إرسال
                </button>

            </div>

        </section>

    </main>


    <!-- ADMIN PANEL -->

    <section id="adminPanel"
             class="panel hidden">

        <h2 class="admin-title">
            👑 إدارة المستخدمين
        </h2>

        <div style="overflow-x:auto">

            <table class="users-table">

                <thead>
                    <tr>
                        <th>الاسم</th>
                        <th>الإيميل</th>
                        <th>النوع</th>
                        <th>المستخدم</th>
                        <th>المتبقي</th>
                        <th>إضافة Quota</th>
                    </tr>
                </thead>

                <tbody id="usersTable"></tbody>

            </table>

        </div>

    </section>

</div>


<div id="notification"
     class="notification">
</div>


<script>

const API_URL =
    "https://ballet-traveller-christmas-monitors.trycloudflare.com/api.php";

const GOOGLE_CLIENT_ID =
    "610561621500-4fk159dv20phoqb3qj90uc0kqsb9tb1i.apps.googleusercontent.com";

let currentUser = null;


/* =========================
   API
========================= */

async function api(action, data = {}) {

    const response = await fetch(API_URL, {

        method: "POST",

        headers: {
            "Content-Type": "application/json"
        },

        body: JSON.stringify({
            action,
            ...data
        })

    });

    const text = await response.text();

    let result;

    try {
        result = JSON.parse(text);
    } catch {
        throw new Error(
            "الـPHP رجع Response غير صالح: " + text
        );
    }

    if (!response.ok || result.success === false) {
        throw new Error(
            result.message || "حدث خطأ في API"
        );
    }

    return result;
}


/* =========================
   GOOGLE LOGIN
========================= */

function initGoogle() {

    if (!window.google ||
        !google.accounts ||
        !google.accounts.id) {

        setTimeout(initGoogle, 500);
        return;
    }

    google.accounts.id.initialize({

        client_id: GOOGLE_CLIENT_ID,

        callback: googleLogin,

        auto_select: false,

        cancel_on_tap_outside: true

    });


    google.accounts.id.renderButton(

        document.getElementById("googleButton"),

        {
            theme: "filled_black",
            size: "large",
            text: "signin_with",
            shape: "pill",
            width: 300
        }

    );
}


async function googleLogin(response) {

    const errorBox =
        document.getElementById("loginError");

    errorBox.textContent = "";

    try {

        const result = await api(
            "login",
            {
                credential: response.credential
            }
        );

        currentUser = result.user;

        localStorage.setItem(
            "remo_user",
            JSON.stringify(currentUser)
        );

        showApp();

    } catch (error) {

        console.error(error);

        errorBox.textContent =
            error.message ||
            "فشل تسجيل الدخول";

    }
}


/* =========================
   SHOW APP
========================= */

function showApp() {

    document
        .getElementById("loginScreen")
        .classList.add("hidden");

    document
        .getElementById("app")
        .classList.remove("hidden");

    updateUserUI();

    loadConversation();

    if (currentUser.role === "admin") {

        document
            .getElementById("adminButton")
            .classList.remove("hidden");

        loadUsers();
    }
}


function updateUserUI() {

    if (!currentUser) return;

    document.getElementById("topName").textContent =
        currentUser.name || currentUser.email;

    document.getElementById("profileName").textContent =
        currentUser.name || "User";

    document.getElementById("profileEmail").textContent =
        currentUser.email;

    document.getElementById("profileRole").textContent =
        currentUser.role === "admin"
            ? "ADMIN"
            : "GUEST";


    const avatar =
        currentUser.picture ||
        "https://www.gravatar.com/avatar/?d=mp";

    document.getElementById("topAvatar").src =
        avatar;

    document.getElementById("profileAvatar").src =
        avatar;


    updateQuota();
}


function updateQuota() {

    const box =
        document.getElementById("quotaBox");

    const send =
        document.getElementById("sendButton");

    const logoutBtn =
        document.getElementById("logoutButton");


    if (currentUser.role === "admin") {

        box.textContent =
            "المتبقي: ∞";

        send.disabled = false;

        logoutBtn.disabled = false;

        return;
    }


    box.textContent =
        "المتبقي: " +
        Number(currentUser.remaining || 0);


    if (Number(currentUser.remaining || 0) <= 0) {

        send.disabled = true;

        /*
         * حسب طلبك:
         * عند انتهاء الـQuota لا يستطيع Guest
         * تسجيل الخروج.
         */
        logoutBtn.disabled = true;

    } else {

        send.disabled = false;
        logoutBtn.disabled = false;
    }
}


/* =========================
   CHAT
========================= */

function addMessage(type, text) {

    const container =
        document.getElementById("messages");

    const div =
        document.createElement("div");

    div.className =
        "message " + type;

    div.textContent = text;

    container.appendChild(div);

    container.scrollTop =
        container.scrollHeight;
}


async function sendMessage() {

    if (!currentUser) return;

    const input =
        document.getElementById("prompt");

    const button =
        document.getElementById("sendButton");

    const prompt =
        input.value.trim();

    if (!prompt) return;


    if (
        currentUser.role !== "admin" &&
        Number(currentUser.remaining || 0) <= 0
    ) {

        showNotification(
            "انتهى الـQuota الخاص بك"
        );

        return;
    }


    addMessage("user", prompt);

    input.value = "";

    button.disabled = true;

    try {

        const result =
            await api(
                "chat",
                {
                    email: currentUser.email,
                    message: prompt
                }
            );


        addMessage(
            "ai",
            result.reply || "لم يتم استلام رد."
        );


        if (result.user) {

            currentUser =
                result.user;

            localStorage.setItem(
                "remo_user",
                JSON.stringify(currentUser)
            );

            updateUserUI();
        }


    } catch (error) {

        console.error(error);

        addMessage(
            "system",
            "❌ " + error.message
        );

    } finally {

        if (
            currentUser &&
            (
                currentUser.role === "admin" ||
                Number(currentUser.remaining || 0) > 0
            )
        ) {

            button.disabled = false;
        }
    }
}


function handleKey(event) {

    if (
        event.key === "Enter" &&
        !event.shiftKey
    ) {

        event.preventDefault();

        sendMessage();
    }
}


/* =========================
   LOAD CONVERSATION
========================= */

async function loadConversation() {

    if (!currentUser) return;

    try {

        const result =
            await api(
                "history",
                {
                    email: currentUser.email
                }
            );


        const container =
            document.getElementById("messages");

        container.innerHTML = "";


        if (!result.messages ||
            result.messages.length === 0) {

            addMessage(
                "system",
                "أهلاً بك في REMO AI 👋"
            );

            return;
        }


        result.messages.forEach(message => {

            addMessage(
                message.role === "user"
                    ? "user"
                    : "ai",
                message.content
            );

        });

    } catch (error) {

        console.error(error);
    }
}


/* =========================
   ADMIN USERS
========================= */

async function loadUsers() {

    if (!currentUser ||
        currentUser.role !== "admin") {

        return;
    }


    try {

        const result =
            await api(
                "users",
                {
                    email: currentUser.email
                }
            );


        const tbody =
            document.getElementById("usersTable");

        tbody.innerHTML = "";


        result.users.forEach(user => {

            const tr =
                document.createElement("tr");

            const remaining =
                user.role === "admin"
                    ? "∞"
                    : user.remaining;


            tr.innerHTML = `

                <td>${escapeHtml(user.name || "-")}</td>

                <td>${escapeHtml(user.email || "-")}</td>

                <td>${user.role}</td>

                <td>${user.used || 0}</td>

                <td>${remaining}</td>

                <td>

                    ${
                        user.role === "admin"
                        ? "-"
                        : `
                        <input
                            id="quota_${encodeURIComponent(user.email)}"
                            class="quota-input"
                            type="number"
                            min="1"
                            value="100"
                        >

                        <button
                            class="add-quota"
                            onclick="addQuota('${escapeJs(user.email)}')">
                            + إضافة
                        </button>
                        `
                    }

                </td>

            `;

            tbody.appendChild(tr);

        });


        document
            .getElementById("adminPanel")
            .classList.remove("hidden");


    } catch (error) {

        showNotification(
            error.message
        );
    }
}


async function addQuota(email) {

    const input =
        document.getElementById(
            "quota_" +
            encodeURIComponent(email)
        );

    const amount =
        Number(input.value);


    if (!amount || amount <= 0) {

        showNotification(
            "اكتب عدد صحيح أكبر من صفر"
        );

        return;
    }


    try {

        await api(
            "add_quota",
            {
                admin_email:
                    currentUser.email,

                user_email:
                    email,

                amount
            }
        );


        showNotification(
            "تمت إضافة الـQuota بنجاح ✅"
        );


        loadUsers();


    } catch (error) {

        showNotification(
            error.message
        );
    }
}


/* =========================
   ADMIN MESSAGES
========================= */

async function openAdminMessages() {

    if (!currentUser) return;


    try {

        const result =
            await api(
                "messages",
                {
                    email:
                        currentUser.email
                }
            );


        if (!result.messages.length) {

            showNotification(
                "لا توجد رسائل جديدة"
            );

            return;
        }


        result.messages.forEach(message => {

            showNotification(
                message.from_email +
                ": " +
                message.message
            );

        });


    } catch (error) {

        showNotification(
            error.message
        );
    }
}


/* =========================
   NOTIFICATIONS
========================= */

function showNotification(text) {

    const box =
        document.getElementById(
            "notification"
        );

    box.textContent = text;

    box.style.display = "block";


    clearTimeout(
        window.notificationTimer
    );


    window.notificationTimer =
        setTimeout(() => {

            box.style.display =
                "none";

        }, 4000);
}


/* =========================
   LOGOUT
========================= */

function logout() {

    if (!currentUser) return;


    if (
        currentUser.role !== "admin" &&
        Number(currentUser.remaining || 0) <= 0
    ) {

        showNotification(
            "لا يمكنك تسجيل الخروج بعد انتهاء الـQuota"
        );

        return;
    }


    localStorage.removeItem(
        "remo_user"
    );

    currentUser = null;

    location.reload();
}


/* =========================
   HELPERS
========================= */

function escapeHtml(value) {

    return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
}


function escapeJs(value) {

    return String(value)
        .replaceAll("\\", "\\\\")
        .replaceAll("'", "\\'");
}


/* =========================
   START
========================= */

window.addEventListener(
    "load",
    () => {

        initGoogle();

    }
);

</script>

</body>
</html>
